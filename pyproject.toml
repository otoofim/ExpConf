[project]
name = "cvpr-explorer"
version = "0.1.0"
description = "Interactive 2D browser for computer vision conference papers"
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "dash==2.17.1",
    "plotly==5.22.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.5.0",
    "umap-learn==0.5.6",
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "tqdm==4.66.4",
]

[dependency-groups]
dev = []
